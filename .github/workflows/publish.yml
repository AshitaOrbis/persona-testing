# Publish to npm via OIDC trusted publishing.
#
# Security design (see SECURITY.md):
#   - The build job runs npm ci / npm test / npm run build / npm pack with NO
#     publishing privileges. Dependency lifecycle scripts never see an OIDC token.
#   - The publish job has id-token: write but never runs npm ci or build
#     scripts — it only downloads the already-built tarball and publishes it.
#   - All actions are pinned to full commit SHAs.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-tarball
          path: '*.tgz'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-tarball
      # npm >= 11.5.1 is required for OIDC trusted publishing; pin the exact
      # version instead of npm@latest so the publish toolchain is reproducible.
      - run: npm install -g npm@11.5.1
      - run: npm publish ./persona-testing-*.tgz --provenance --access public
